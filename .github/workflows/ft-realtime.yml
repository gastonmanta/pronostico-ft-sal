# Detección diaria del frente de turbidez con MODIS (NASA AppEEARS).
# Guarda la última detección válida en ft_realtime/web/ y vuelve a publicar GitHub Pages.
name: ft-realtime
on:
  schedule:
    - cron: '43 14 * * *'   # 14:43 UTC = 11:43 en Uruguay
  workflow_dispatch:
    inputs:
      days:
        description: 'Días hacia atrás a pedir a AppEEARS'
        default: '10'
permissions:
  contents: write
  actions: write
concurrency: {group: ft-realtime, cancel-in-progress: false}
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r ft_realtime/requirements.txt
      - name: Bajar MODIS de AppEEARS y detectar el FT
        env:
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
        run: python ft_realtime/run_ft_realtime.py --out ft_realtime/web --days ${{ inputs.days || '10' }}
      - name: Guardar resultados en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ft_realtime/web
          git diff --cached --quiet || git commit -m "FT tiempo real: $(date -u +%Y-%m-%d)"
          git push
      - name: Volver a publicar GitHub Pages
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh workflow run pronostico.yml --ref ${{ github.ref_name }}
